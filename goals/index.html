<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My 2027 Goal Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f4f2,#0e0e0e);--card:light-dark(#fff,#1a1a1a);--ink:light-dark(#121212,#f1f1ef);--mute:light-dark(#5f5f5b,#a9a9a4);--line:light-dark(#e2e2de,#2c2c2c);--acc:light-dark(#3a3e45,#8a8f98);--soft:light-dark(#eceef1,#25282c);--ok:light-dark(#1f7a3f,#4cc27a);--head:light-dark(#dde1e7,#23262b);--field:light-dark(#f3f4f7,#2f3338)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
header{background:var(--head);border-bottom:1px solid light-dark(#c8ced6,#33373d);padding:16px 0 14px}
.brand{display:flex;gap:12px;align-items:flex-start}
.logo{width:84px;height:84px;flex:none;object-fit:contain}
h1{margin:0;font:700 clamp(18px,4.6vw,26px)/1.15 Inter,sans-serif}
.sub{font-size:13px;color:light-dark(#4b5159,#a9a9a4);margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}
.st{height:44px;border-radius:10px;border:1px solid light-dark(#c8ced6,#444950);background:var(--field);color:var(--ink);font-weight:600;font-size:14px;padding:0}
.st.on{background:var(--acc);border-color:var(--acc);color:#fff}
.st.done:not(.on){color:var(--ok)}
main{padding:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
h2{margin:0 0 4px;font:700 20px/1.2 Inter,sans-serif}
.lead{color:var(--mute);font-size:15px;margin:0 0 14px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font:inherit;font-size:16px}
input{height:46px}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opts{display:grid;gap:10px}
.fo{text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:14px;min-height:44px}
.fo b{display:block;font-size:16px;margin-bottom:4px}.fo span{font-size:14px;color:var(--mute);line-height:1.4}
.fo.on{border-color:var(--acc);background:var(--soft)}
.sentence{background:var(--soft);border-radius:12px;padding:14px;font-size:17px;font-weight:600;line-height:1.4;margin-top:14px}
.note{font-size:14px;color:var(--mute);margin-top:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
.tbl th,.tbl td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left;font-weight:600}
.tbl th{font-size:12px;color:var(--mute);font-weight:600}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.btn{height:50px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:15px;padding:0 10px}
.btn.main{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.4}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.msg{min-height:22px;font-size:14px;color:var(--ok);text-align:center;margin:6px 0}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.mini div{background:var(--soft);border-radius:10px;padding:8px 6px;text-align:center;font-size:12px;color:var(--mute)}
.mini b{display:block;font-size:15px;color:var(--ink)}
footer{padding:22px 0 40px;margin-top:20px;background:var(--card);border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--mute)}
dialog{border:0;border-radius:16px;padding:18px;max-width:560px;width:calc(100% - 24px);background:var(--card);color:var(--ink);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h3{margin:0 0 8px;font-size:20px}
/* printable sheet */
#sheet{display:none}
.sh{font-family:Inter,system-ui,sans-serif;color:#121212}
.sh h3{margin:14px 0 4px;font-size:14px;border-bottom:2px solid #3a3e45;padding-bottom:3px}
.sh p{margin:2px 0;font-size:12.5px;line-height:1.45}
.sh .big{font-size:17px;font-weight:700;line-height:1.35;margin:8px 0}
.sh table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.sh th,.sh td{padding:5px 6px;border-bottom:1px solid #ccc;text-align:right}
.sh th:first-child,.sh td:first-child{text-align:left}
.sh .top{display:flex;align-items:center;gap:12px;border-bottom:1px solid #aaa;padding-bottom:8px}
.sh .top img{width:70px;height:70px}
.sh .sig{margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:12px}
.sh .sig div{border-top:1px solid #121212;padding-top:4px}
@media print{body>*:not(#sheet){display:none!important}#sheet{display:block}body{background:#fff}@page{margin:14mm}}
@media(max-width:480px){.logo{width:72px;height:72px}.st{font-size:13px}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

 <h3>The Numbers</h3><table><tr><th></th><th>${inc()?'Income':'Licensed'}</th><th>${c.an}</th><th>${c.bn}</th><th>${c.cn}</th></tr>${c.rows.map(r=>`<tr><td>${r.n}</td><td>${c.unit(r.main)}</td><td>${num(r.a)}</td><td>${num(r.b)}</td><td>${num(r.c)}</td></tr>`).join('')}</table>
 <p style="margin-top:4px">Weekly points needed: <b>${num(c.pts)}</b> (100 points a week = ${inc()?'$100,000':'100 licensed'} a year).${N(S.passive)?' Passive income goal: <b>'+money(N(S.passive))+' a month</b>.':''}</p>
 <h3>Milestones</h3><table>${q.map(([d,f])=>`<tr><td>By ${d}</td><td>${c.unit(c.main*f)}</td></tr>`).join('')}</table><p><b>My first 30 days:</b> ${esc(S.f30)||'—'}</p>
 <h3>If This Happens, Then I Will</h3><p>1. If ${esc(S.o1i)||'___'}, then ${esc(S.o1t)||'___'}.</p><p>2. If ${esc(S.o2i)||'___'}, then ${esc(S.o2t)||'___'}.</p>
 <div class="sig"><div>${esc(S.sign)||'Signature'}</div><div>Executive Director${S.ed?': '+esc(S.ed):''}</div></div>`;
 S=keep;return h;
}
function view(){
 const c=calc();let h='';
 if(step===0)h=`<div class="card"><h2>Step 1 · Dream</h2><p class="lead">It is December 31, 2027. This was your best year ever. What happened? Write it like it already came true.</p>${fld('name','Your Name','t')}${fld('ed','Your Executive Director','t')}${fld('dInc','My Income','ta','What did I earn, and what did it let me do?')}${fld('dFam','My Family And Life','ta','What does life look like for my family?')}${fld('dTeam','My Team','ta','Who is on my team and what are they doing?')}</div>`;
 if(step===1)h=`<div class="card"><h2>Step 2 · Pick Your Focus</h2><p class="lead">Pick one. You can still earn bonus points on the other side.</p><div class="opts"><button class="fo${inc()&&S.focus?' on':''}" data-f="inc"><b>Six-Figure Income</b><span>I am committed to making six figures. Every call and every client meeting gets me closer.</span></button><button class="fo${S.focus==='team'?' on':''}" data-f="team"><b>Building My Dream Team</b><span>I am here to build my passive income and retire by 2030, within the next 5 years.</span></button></div></div>`;
 if(step===2){const f=inc();h=`<div class="card"><h2>Step 3 · My Clear Goal</h2><p class="lead">A goal needs a number and a date. Otherwise it is a wish. The date is December 31, 2027.</p>${fld('goal',f?'My Income Goal For 2027 ($)':'Licensed Associates On My Team By Dec 31, 2027','n',f?'150000':'100')}${fld('why','So My Family…','t','…can live in our own home')}${fld('base',f?'My Income Over The Last 12 Months ($)':'Associates I Licensed In The Last 12 Months','n','0')}<div class="sentence" id="sent">${esc(sentenceTxt())||'Your goal sentence will appear here.'}</div><div class="note" id="stretch"></div></div>`}
 if(step===3){const f=inc();h=`<div class="card"><h2>Step 4 · The Numbers</h2><p class="lead">Work it backwards. The defaults come from the team's 100 point plan. Change them to match your real results.</p><div class="two">${fld('weeks','Working Weeks','n')}${f?fld('deal','Income Per Deal ($)','n'):fld('lic','Recruits Who Get Licensed (%)','n')}</div><div class="two">${f?fld('mtg','Meetings For 1 Deal','n')+fld('cpm','Calls For 1 Meeting','n'):fld('ppr','Presentations For 1 Recruit','n')+fld('cpp','Calls For 1 Presentation','n')}</div>${fld('passive','Passive Income Goal From Investments And Travel ($ A Month)','n','3000')}<div id="calc"></div></div>`}
 if(step===4)h=`<div class="card"><h2>Step 5 · Milestones</h2><p class="lead">Big goals are built in 90-day pieces.</p><table class="tbl"><tr><th>Checkpoint</th><th>${f_lbl()}</th></tr>${[['March 31, 2027',.25],['June 30, 2027',.5],['September 30, 2027',.75],['December 31, 2027',1]].map(([d,x])=>`<tr><td>${d}</td><td>${c.unit(c.main*x)}</td></tr>`).join('')}</table>${fld('f30','My First 30 Days: What Will I Do In January?','ta','The first three actions I will take')}</div>`;
 if(step===5)h=`<div class="card"><h2>Step 6 · Obstacles</h2><p class="lead">Name the two things most likely to stop you. Decide now what you will do. ${S.ed?esc(S.ed)+' is':'Your ED is'} your accountability partner.</p>${fld('o1i','Obstacle 1: If…','t','I do not feel like calling')}${fld('o1t','…Then I Will','t','call anyway for 10 minutes')}${fld('o2i','Obstacle 2: If…','t','a prospect says not now')}${fld('o2t','…Then I Will','t','book a follow-up date')}</div>`;
 if(step===6)h=`<div class="card"><h2>Step 7 · Commit</h2><p class="lead">Read your goal out loud. Then sign it.</p><div class="sentence">${esc(sentenceTxt())||'Go back to Step 3 and set your goal.'}</div>${fld('sign','Type Your Name To Sign','t')}<div class="mini"><div><b>${num(c.pts)}</b>Points A Week</div><div><b>${num(c.weekly.c)}</b>Calls A Week</div><div><b>${num(c.weekly.b)}</b>${c.bn} A Week</div><div><b>${num(c.weekly.a)}</b>${c.an} A Week</div></div><div class="acts"><button class="btn main" id="send">Send To My Chart</button><button class="btn" id="prt">Print Or Save PDF</button><button class="btn" id="cpy">Copy My Goal Code</button><button class="btn" id="opn">Open A Goal Code</button></div><div class="msg" id="msg" role="status"></div></div>`;
 $('body').innerHTML=h;
 $('steps').innerHTML=STEPS.map((s,i)=>`<button class="st${i===step?' on':''}${i<step?' done':''}" data-s="${i}" aria-label="Step ${i+1} ${s}">${i+1}</button>`).join('');
 $('back').disabled=step===0;$('next').style.display=step===6?'none':'';
 if(step===3)upCalc();if(step===2)upStretch();
}
const f_lbl=()=>inc()?'Income':'Licensed';
function upCalc(){const c=calc();if(!N(S.goal)){$('calc').innerHTML='<div class="note">Set your goal in Step 3 to see your numbers.</div>';return}
 $('calc').innerHTML=`<table class="tbl"><tr><th></th><th>${f_lbl()}</th><th>${c.an}</th><th>${c.bn}</th><th>${c.cn}</th></tr>${c.rows.map(r=>`<tr><td>${r.n}</td><td>${c.unit(r.main)}</td><td>${num(r.a)}</td><td>${num(r.b)}</td><td>${num(r.c)}</td></tr>`).join('')}</table><div class="note"><b>${num(c.pts)} points a week</b> on the team chart. Week and day rows use your ${num(c.w)} working weeks and 5 working days.</div>`}
function upStretch(){const g=N(S.goal),b=N(S.base);$('sent').textContent=sentenceTxt()||'Your goal sentence will appear here.';
 if(!g||!b){$('stretch').textContent='';return}const x=g/b;$('stretch').textContent=x<=1.2?'That is about the same as your last 12 months. Make sure it is a real stretch.':x<=3?`That is ${(Math.round(x*10)/10)}x your last 12 months. A strong stretch. Your weekly habits will carry it.`:`That is ${Math.round(x*10)/10}x your last 12 months. Big. Be ready to prove the first 90 days.`}
function msg(t){const m=$('msg');if(m){m.textContent=t;setTimeout(()=>{if(m)m.textContent=''},4500)}}
$('body').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;S[k]=e.target.value;save();if(step===2)upStretch();if(step===3)upCalc()});
$('body').addEventListener('click',e=>{
 const f=e.target.closest('[data-f]');if(f){S.focus=f.dataset.f;save();view();return}
 const id=e.target.closest('button')&&e.target.closest('button').id;
 if(id==='prt'){$('sheet').innerHTML=sheetHtml(S);window.print()}
 if(id==='cpy'){const c=code();(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>msg('Goal Code copied. Send it to your ED.')).catch(()=>{prompt('Copy your Goal Code:',c)})}
 if(id==='opn'){$('vT').textContent='Open A Goal Code';$('vB').innerHTML='<label for="vIn">Paste The Goal Code</label><textarea id="vIn" placeholder="YIC1-..."></textarea><div id="vView"></div>';$('vUse').style.display='none';$('dlgV').showModal();$('vIn').addEventListener('input',()=>{try{const s=decode($('vIn').value);$('vView').innerHTML='<div class="sh" style="margin-top:12px">'+sheetHtml(s)+'</div>';$('vUse').style.display='';$('vUse').onclick=()=>{S=s;save();$('dlgV').close();step=0;view();msg('Restored.')}}catch(x){$('vView').innerHTML=$('vIn').value.trim()?'<div class="note">That code does not look right. Check that the whole code was pasted.</div>':'';$('vUse').style.display='none'}})}
 if(id==='send'){if(!N(S.goal)){msg('Set your goal in Step 3 first.');return}
  try{const c=calc(),w=c.weekly;let ch={};try{ch=JSON.parse(localStorage.getItem(CHART)||'{}')}catch(x){}
   const t={calls:Math.ceil(w.c)};if(inc()){t.meet=Math.ceil(w.b);t.life=Math.ceil(w.a)}else{t.bmp=Math.ceil(w.b);t.recruit=Math.ceil(w.a)}
   ch.focus=S.focus||'inc';ch.targets=t;if(!ch.name)ch.name=S.name;if(!ch.ed)ch.ed=S.ed;localStorage.setItem(CHART,JSON.stringify(ch));S.sent=1;save();
   $('msg').innerHTML='Sent. <a href="https://teamyic.github.io/100-points/">Open My Chart</a>'}catch(x){msg('Could not save here. Use your Goal Code instead.')}}
});
$('dlgV').addEventListener('close',()=>{});
$('vClose').addEventListener('click',()=>$('dlgV').close());
$('steps').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){step=+b.dataset.s;view();window.scrollTo(0,0)}});
$('back').addEventListener('click',()=>{if(step>0){step--;view();window.scrollTo(0,0)}});
$('next').addEventListener('click',()=>{if(step<6){step++;view();window.scrollTo(0,0)}});
const fit=()=>{const h=$('ttl').offsetHeight;if(h)$('logo').style.width=$('logo').style.height=Math.min(Math.max(h,72),110)+'px'};
window.addEventListener('resize',fit);
view();fit();document.fonts&&document.fonts.ready.then(fit);
}
</script>
</body>
</html>
